<style>
:root{
  --bg:#0E1116;--panel:#141A21;--panel2:#1A212B;--border:#252E3A;
  --text:#E6EDF3;--dim:#8B98A5;--accent:#C8A96A;
  /* 底图（深色）：领土面、区县界、市域线、注记，全部走变量 */
  --map-bg:#0C1117;
  --district-fill:#1A2430;
  --county-line:#3A4B60;
  --city-line:#6D8199;
  --map-label:#5A6A7E;
  /* 水系 / 路网 */
  --water-fill:#14364A;
  --water-line:#2F6280;
  --road-case:#0C1117;
  --road-main:#2F4055;
  --road-local:#2A3A4C;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC",Georgia,serif;
}
[data-theme="light"]{
  --bg:#F4F2EC;--panel:#FFFFFF;--panel2:#EFECE4;--border:#DCD7CC;
  --text:#1A1F26;--dim:#6B7280;--accent:#A8823E;
  /* 底图（浅色）：宣纸感 */
  --map-bg:#F4F0E5;
  --district-fill:#FBF7EC;
  --county-line:#D8CBB4;
  --city-line:#A08C6E;
  --map-label:#A2937B;
  /* 水系 / 路网 */
  --water-fill:#DDEAF1;
  --water-line:#8FB2C8;
  --road-case:#F2EEE3;
  --road-main:#CFC0A3;
  --road-local:#DDD2BB;
  --shadow:0 12px 40px rgba(30,40,50,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
@supports(height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;transition:background .35s,color .35s;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input{font-family:inherit}

/* Header */
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);background:var(--panel);position:relative;z-index:50;flex-shrink:0;gap:12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{height:26px;display:flex;align-items:center;flex-shrink:0}
.brand-mark .logo{height:26px;width:auto;display:block;border-radius:6px}
[data-theme="dark"] .logo-light{display:none}
[data-theme="light"] .logo-dark{display:none}
.titles{min-width:0}
.titles h1{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles p{font-size:10.5px;color:var(--dim);letter-spacing:.8px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.tools input{width:170px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:16px;background:var(--panel2);color:var(--text);font-size:12px;outline:none;transition:border-color .2s}
.tools input:focus{border-color:var(--accent)}
.tools input::placeholder{color:var(--dim)}
.tools button{height:32px;padding:0 11px;border:1px solid var(--border);border-radius:16px;background:var(--panel2);color:var(--text);font-size:11.5px;cursor:pointer;transition:.18s;letter-spacing:.3px;white-space:nowrap}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.tools button.on{border-color:var(--accent);color:var(--accent);background:rgba(200,169,106,.1)}

/* Layout */
main{display:flex;height:calc(100% - 64px);position:relative;overflow:hidden}
#sidebar{width:352px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border) transparent;z-index:20}
#sidebar::-webkit-scrollbar{width:5px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.section{padding:16px 18px;border-bottom:1px solid var(--border)}
.section-title{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}

/* Legend */
.legend-item{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:5px;cursor:pointer;transition:background .15s;user-select:none}
.legend-item:hover{background:var(--panel2)}
.legend-item.off{opacity:.32}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:.2s}
.legend-item.off .legend-dot{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--dim)}
.legend-name{flex:1;font-size:12px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-count{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}

/* Routes */
.route-item{display:flex;align-items:center;gap:9px;padding:8px 7px;border-radius:5px;cursor:pointer;transition:.15s;user-select:none}
.route-item:hover,.route-item.active{background:var(--panel2)}
.route-line{width:16px;height:3px;border-radius:2px;flex-shrink:0}
.route-name{flex:1;font-size:12px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-sub{font-size:10px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* List */
.proj-item{display:flex;align-items:flex-start;gap:10px;padding:8px 7px;border-radius:5px;cursor:pointer;transition:.15s}
.proj-item:hover,.proj-item.active{background:var(--panel2)}
.proj-num{font-size:10px;font-variant-numeric:tabular-nums;color:var(--dim);width:20px;text-align:right;flex-shrink:0;padding-top:2px}
.proj-bar{width:2.5px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:26px}
.proj-txt{flex:1;min-width:0}
.proj-name{font-size:12.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.approx-mark{color:var(--dim);font-size:10px;margin-left:5px;letter-spacing:0}
.legend-note{margin-top:9px;font-size:10px;line-height:1.5;color:var(--dim);letter-spacing:.2px;opacity:.85}
.proj-en{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.empty{text-align:center;padding:28px 10px;color:var(--dim);font-size:12px}

/* Map */
#mapWrap{flex:1;position:relative;overflow:hidden;background:var(--map-bg);transition:background .35s}
#map{position:absolute;top:0;left:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#amap{position:absolute;inset:0;z-index:1;pointer-events:none}
#amap.amap-live{pointer-events:auto}
.am-dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.35);transition:transform .15s}
.am-dot.on{transform:scale(1.5);box-shadow:0 0 0 2px #fff}
#map.dragging{cursor:grabbing}
#map.picking{cursor:crosshair}

/* 底图要素：面 / 区县界 / 市域线 / 注记 */
.district-fill{fill:var(--district-fill);stroke:var(--district-fill);stroke-linejoin:round}
.county-line{fill:none;stroke:var(--county-line);stroke-linecap:butt;opacity:.95}
.city-line{fill:none;stroke:var(--city-line);stroke-linejoin:round;stroke-linecap:round}
/* 水系 */
.water-fill{fill:var(--water-fill);stroke:var(--water-line);stroke-linejoin:round;fill-rule:nonzero}
.water-line{fill:none;stroke:var(--water-line);stroke-linecap:round;stroke-linejoin:round}
.canal-line{fill:none;stroke:var(--water-line);stroke-linecap:round;stroke-linejoin:round;opacity:.85}
/* 路网：先描边（底色）再画芯线，压住底图更清晰 */
.road-case{fill:none;stroke:var(--road-case);stroke-linecap:round;stroke-linejoin:round}
.road-main{fill:none;stroke:var(--road-main);stroke-linecap:round;stroke-linejoin:round}
.road-local{fill:none;stroke:var(--road-local);stroke-linecap:round;stroke-linejoin:round}
.map-credit{position:absolute;right:14px;bottom:14px;font-size:9px;letter-spacing:.2px;color:var(--dim);opacity:.7;pointer-events:none;z-index:14;text-align:right}
/* 我的位置 */
.geo-btn{position:absolute;right:14px;bottom:44px;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);z-index:16;transition:.18s;padding:0}
.geo-btn:hover{border-color:var(--accent);color:var(--accent)}
.geo-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(200,169,106,.12)}
.geo-btn.loading svg{animation:geo-spin 1s linear infinite}
@keyframes geo-spin{to{transform:rotate(360deg)}}
.me-acc{fill:rgba(61,139,253,.10);stroke:rgba(61,139,253,.40);stroke-width:1px;vector-effect:non-scaling-stroke}
.me-pulse{opacity:.28;transform-box:fill-box;transform-origin:center;animation:me-pulse 2.4s ease-out infinite}
@keyframes me-pulse{0%{transform:scale(.7);opacity:.35}70%{transform:scale(2.1);opacity:0}100%{opacity:0}}
.me-ring{stroke:var(--map-bg);stroke-width:2px;vector-effect:non-scaling-stroke}
.me-dot{stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke}
.near-card{position:absolute;left:14px;bottom:52px;width:272px;max-height:236px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:17;display:flex;flex-direction:column;overflow:hidden}
.near-card[hidden]{display:none}
.near-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);font-size:11px;letter-spacing:1px;color:var(--dim)}
.near-head b{color:var(--accent);font-weight:600;letter-spacing:0}
.near-head button{border:none;background:transparent;color:var(--dim);font-size:13px;cursor:pointer;padding:0 2px;line-height:1}
.near-head button:hover{color:var(--text)}
.near-list{overflow-y:auto;padding:4px}
.near-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:none;background:transparent;color:var(--text);text-align:left;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
.near-item:hover{background:var(--panel2)}
.near-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.near-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.near-dist{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;flex-shrink:0}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:12px;padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:24;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){.map-credit{right:10px;bottom:calc(46px + env(safe-area-inset-bottom));font-size:8px}}.district-label{fill:var(--map-label);text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.6px;paint-order:stroke;stroke:var(--map-bg);stroke-linejoin:round}

/* Points */
.pt{cursor:pointer;transition:opacity .2s}
.pt circle.dot{stroke:var(--bg);transition:r .1s,stroke-width .1s,stroke .2s}
.pt:hover circle.dot{stroke:var(--text)}
.pt.active circle.dot{stroke:var(--text)}
.pt circle.halo{fill:none;opacity:.85;pointer-events:none}
.pt text{fill:var(--text);font-weight:600;pointer-events:none;text-anchor:middle;dominant-baseline:central;opacity:0;transition:opacity .2s}
.pt:hover text,.pt.active text{opacity:1}
.pt.hidden{display:none}

.route-path{fill:none;stroke-width:2.5;stroke-dasharray:8 6;opacity:.8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}

/* Tooltip */
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:11.5px;padding:5px 9px;border-radius:5px;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;white-space:nowrap;z-index:30;transform:translate(-50%,-140%)}
#tip.show{opacity:1}
.map-badge{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:7px 13px;font-size:11px;color:var(--dim);box-shadow:var(--shadow);z-index:15;letter-spacing:.3px;display:flex;flex-direction:column;gap:2px;max-width:min(360px,calc(100% - 28px))}
.map-badge b{color:var(--accent);font-weight:600}
.map-badge .src{font-size:9.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-badge .src.warn{color:var(--accent);opacity:.9}
#mapWrap.amap-on .map-badge{top:14px;bottom:auto}
#mapWrap.amap-on .map-credit{display:none}

/* Drawer */
#drawer{position:absolute;top:0;right:0;width:392px;max-width:100%;height:100%;background:var(--panel);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);z-index:35;display:flex;flex-direction:column}
#drawer.open{transform:translateX(0)}
.drawer-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);position:relative;flex-shrink:0}
.drawer-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border:none;background:var(--panel2);color:var(--dim);border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.18s}
.drawer-close:hover{background:var(--border);color:var(--text)}
.drawer-cat{display:inline-block;font-size:10px;letter-spacing:.8px;padding:3px 9px;border-radius:10px;margin-bottom:9px;font-weight:600}
.drawer-title{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.3px;line-height:1.35;padding-right:30px}
.drawer-en{font-size:11.5px;color:var(--dim);margin-top:4px;letter-spacing:.2px}
.drawer-body{flex:1;overflow-y:auto;padding:0}
.drawer-img{width:100%;aspect-ratio:16/9;background:var(--panel2);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);overflow:hidden;position:relative}
.drawer-img img{width:100%;height:100%;object-fit:cover;display:block}
.drawer-img svg{width:96px;height:96px;color:var(--dim);opacity:.55}
.img-btn{position:absolute;right:10px;bottom:10px;height:28px;padding:0 11px;border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(12,17,23,.62);color:#fff;font-size:11px;letter-spacing:.3px;cursor:pointer;backdrop-filter:blur(6px);transition:.18s}
.img-btn:hover{border-color:var(--accent);color:var(--accent)}
.img-btn.remove{right:auto;left:10px;opacity:.85}
.export-btn{width:100%;height:36px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;font-size:12px;letter-spacing:.4px;cursor:pointer;transition:.18s}
.export-btn:hover{background:rgba(200,169,106,.12)}
.drawer-desc{padding:18px 20px;font-size:13px;line-height:1.75;color:var(--text)}
.drawer-meta{padding:0 20px 18px;display:flex;flex-direction:column;gap:8px}
.meta-row{display:flex;justify-content:space-between;font-size:11.5px;padding:7px 0;border-bottom:1px solid var(--border)}
.meta-row span:first-child{color:var(--dim);letter-spacing:.3px}
.meta-row span:last-child{font-variant-numeric:tabular-nums;letter-spacing:.2px;text-align:right}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0}
.amap-row{display:flex;gap:8px;margin-top:8px}
.amap-row a{flex:1;height:34px;line-height:32px;text-align:center;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text);text-decoration:none;letter-spacing:.3px;transition:.18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amap-row a:hover{border-color:var(--accent);color:var(--accent)}
.amap-row a.primary{border-color:var(--accent);color:var(--accent);background:rgba(200,169,106,.10)}

/* Mobile */
#overlay{display:none}
.mobile-only{display:none!important}
@media(max-width:860px){
  .topbar{height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));gap:8px}
  .brand-mark,.brand-mark .logo{height:20px}
  .titles h1{font-size:13.5px}
  .titles p{display:none}
  .tools input{width:0;padding:0;border:none;opacity:0;transition:.25s;position:absolute;right:0;top:0}
  .tools input.expand{position:static;width:calc(100vw - 250px);max-width:220px;padding:0 12px;border:1px solid var(--border);opacity:1}
  .tools button{padding:0 8px;font-size:10.5px}
  .mobile-only{display:inline-block!important}
  main{height:calc(100% - 56px - env(safe-area-inset-top))}
  #sidebar{position:absolute;left:0;bottom:0;top:0;width:100%;max-width:420px;transform:translateX(-100%);transition:transform .3s;border-right:1px solid var(--border);z-index:45}
  #sidebar.open{transform:translateX(0)}
  #drawer{width:100%;height:74%;top:auto;bottom:0;border-left:none;border-top:1px solid var(--border);border-radius:16px 16px 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom)}
  #drawer.open{transform:translateY(0)}
  #drawer::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:var(--border)}
  .drawer-head{padding-top:22px}
  #overlay{display:block;position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
  #overlay.show{opacity:1;pointer-events:auto}
  .map-badge{left:10px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:10px;padding:5px 10px}
  .geo-btn{right:10px;top:10px;bottom:auto;width:44px;height:44px}
  .near-card{left:10px;right:10px;width:auto;bottom:calc(56px + env(safe-area-inset-bottom));max-height:38vh}
}
</style>
</head>
<body>
<div class="topbar">

/* --- 几何工具 --- */
function polygonsOf(geom){
  if(!geom)return [];
  if(geom.type==='Polygon')return [geom.coordinates];
  if(geom.type==='MultiPolygon')return geom.coordinates;
  return [];
}
function eachRing(geom,fn){polygonsOf(geom).forEach(poly=>poly.forEach(r=>fn(r)));}
function bboxOfGeom(geom){
  let b=[Infinity,Infinity,-Infinity,-Infinity];
  eachRing(geom,r=>r.forEach(p=>{
    if(p[0]<b[0])b[0]=p[0];if(p[1]<b[1])b[1]=p[1];
    if(p[0]>b[2])b[2]=p[0];if(p[1]>b[3])b[3]=p[1];
  }));
  return b;
}
/* Douglas–Peucker：保留首尾，闭合环保证首尾重合 */
function simplify(points,tol){
  const n=points.length;
  if(tol<=0||n<4)return points;
  const keep=new Uint8Array(n);keep[0]=keep[n-1]=1;
  const stack=[[0,n-1]];
  while(stack.length){
    const seg=stack.pop(),i=seg[0],j=seg[1];
    if(j<=i+1)continue;
    const ax=points[i][0],ay=points[i][1];
    const dx=points[j][0]-ax,dy=points[j][1]-ay;
    const len=Math.hypot(dx,dy);
    let best=-1,bi=-1;
    for(let k=i+1;k<j;k++){
      const px=points[k][0]-ax,py=points[k][1]-ay;
      /* 闭合环首尾重合时弦长为 0，退化为到首点的距离，否则整环会被压成两点 */
      const d=len<1e-9?Math.hypot(px,py):Math.abs(dx*py-dy*px)/len;
      if(d>best){best=d;bi=k;}
    }
    if(best>tol){keep[bi]=1;stack.push([i,bi],[bi,j]);}
  }
  const out=[];
  for(let k=0;k<n;k++)if(keep[k])out.push(points[k]);
  return out;
}
function ringPath(ring){
  let d='';
  for(let i=0;i<ring.length;i++){
    d+=(i?'L':'M')+wx(ring[i][0]).toFixed(1)+','+wy(ring[i][1]).toFixed(1);
  }
  return d+'Z';
}
function ringArea(r){
  let s=0;
  for(let i=0;i<r.length;i++){
    const a=r[i],b=r[(i+1)%r.length];
    s+=a[0]*b[1]-b[0]*a[1];
  }
  return s/2;
}
function pointInRing(x,y,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}

/* --- 水系 / 路网：base36 增量解码（1e-4 度） --- */
function unzig(n){return (n&1)?-(n+1)/2:n/2;}
function decodeD(str,close){
  const parts=str.split(';');
  const head=parts[0].split('.');
  let px=parseInt(head[0],36),py=parseInt(head[1],36);
  let d='M'+wx(px/1e4).toFixed(1)+','+wy(py/1e4).toFixed(1);
  for(let i=1;i<parts.length;i++){
    const c=parts[i].split(',');
    px+=unzig(parseInt(c[0],36));py+=unzig(parseInt(c[1],36));
    d+='L'+wx(px/1e4).toFixed(1)+','+wy(py/1e4).toFixed(1);
  }
  return close?d+'Z':d;
}
function osmPath(list,cls,close){
  return el('path',{class:cls,d:list.map(s=>decodeD(s,close)).join('')});
}
/* Catmull-Rom → 三次贝塞尔：水面、河道、渠道用曲线，消除折线感（道路保持直线） */
function curveD(pts,closed){
  const n=pts.length;
  const px=i=>wx(pts[((i%n)+n)%n][0]);
  const py=i=>wy(pts[((i%n)+n)%n][1]);
  const f=v=>v.toFixed(1);
  if(n<3)return 'M'+pts.map(p=>f(wx(p[0]))+','+f(wy(p[1]))).join('L')+(closed?'Z':'');
  let d='M'+f(px(0))+','+f(py(0));
  const segs=closed?n:n-1;
  for(let i=0;i<segs;i++){
    const a=closed?(i-1+n)%n:Math.max(i-1,0);
    const b=i;
    const c=closed?(i+1)%n:Math.min(i+1,n-1);
    const e=closed?(i+2)%n:Math.min(i+2,n-1);
    const x0=px(a),y0=py(a),x1=px(b),y1=py(b),x2=px(c),y2=py(c),x3=px(e),y3=py(e);
    d+='C'+f(x1+(x2-x0)/8)+','+f(y1+(y2-y0)/8)+' '+f(x2-(x3-x1)/8)+','+f(y2-(y3-y1)/8)+' '+f(x2)+','+f(y2);
  }
  return closed?d+'Z':d;
}
function osmCurve(list,cls,close){
  return el('path',{class:cls,d:list.map(s=>curveD(cleanRing(decodePts(s),close),close)).join('')});
}
/* 去掉重合点与闭合重复点，避免零长线段造成的渲染毛刺 */
function cleanRing(pts,closed){
  const out=[];
  for(const p of pts){
    const q=out[out.length-1];
    if(!q||Math.abs(p[0]-q[0])>1e-6||Math.abs(p[1]-q[1])>1e-6)out.push(p);
  }
  if(closed&&out.length>1){
    const a=out[0],b=out[out.length-1];
    if(Math.abs(a[0]-b[0])<1e-6&&Math.abs(a[1]-b[1])<1e-6)out.pop();
  }
  return out;
}
/* Chaikin 细分：湖库岸线做圆角切角，不产生过冲，比贝塞尔更稳 */
function chaikin(pts,closed,iter){
  let cur=pts;
  for(let k=0;k<iter;k++){
    const n=cur.length,out=[];
    const last=closed?n:n-1;
    for(let i=0;i<last;i++){
      const p=cur[i],q=cur[(i+1)%n];
      out.push([p[0]*0.75+q[0]*0.25,p[1]*0.75+q[1]*0.25]);
      out.push([p[0]*0.25+q[0]*0.75,p[1]*0.25+q[1]*0.75]);
    }
    if(!closed){out.unshift(cur[0]);out.push(cur[n-1]);}
    cur=out;
  }
  return cur;
}
function osmPoly(list,cls,close){
  return el('path',{class:cls,d:list.map(s=>{
    const pts=chaikin(cleanRing(decodePts(s),close),close,1);
    return 'M'+pts.map(p=>wx(p[0]).toFixed(1)+','+wy(p[1]).toFixed(1)).join('L')+(close?'Z':'');
  }).join('')});
}
function decodePts(str){
  const parts=str.split(';');
  const head=parts[0].split('.');
  let px=parseInt(head[0],36),py=parseInt(head[1],36);
  const pts=[[px/1e4,py/1e4]];
  for(let i=1;i<parts.length;i++){
    const c=parts[i].split(',');
    px+=unzig(parseInt(c[0],36));py+=unzig(parseInt(c[1],36));
    pts.push([px/1e4,py/1e4]);
  }
  return pts;
}

/* --- 在线数据校验 --- */
function validateGeo(dist,city){
  const fs=(dist&&dist.features)||[];
  if(fs.length!==20)throw new Error('区县要素数异常：'+fs.length);
  const codes=fs.map(f=>String(f.properties&&f.properties.adcode||''));
  if(!codes.every(a=>/^5101\d{2}$/.test(a)))throw new Error('区县 adcode 异常：'+codes.join(','));
  if(!codes.includes('510185'))throw new Error('区县列表缺少简阳市');
  const cityF=((city&&city.features)||[]).find(f=>String(f.properties&&f.properties.adcode)==='510100');
  if(!cityF)throw new Error('市域要素 510100 缺失');
  const b=bboxOfGeom(cityF.geometry);
  if(!(b[0]>102.7&&b[2]<105.1&&b[1]>29.8&&b[3]<31.7))throw new Error('市域 bbox 异常：'+b.join(','));
  return {dist,cityF};
}

async function fetchJSON(url,ms){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms||9000);
  try{
    const res=await fetch(url,{signal:ctrl.signal,mode:'cors',credentials:'omit'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    return await res.json();
  }finally{clearTimeout(timer);}
}

/* --- 归一化：在线 → 内部结构；离线 → 内置结构 --- */
const SIMPLIFY_LIVE=0.00055;   /* ≈55 m，屏幕不可辨 */
function fromLive(dist,cityF,tol){
  const districts=[];
  dist.features.forEach(f=>{
    const p=f.properties||{};
    const rings=[];
    eachRing(f.geometry,r=>{
      const s=simplify(r.map(pt=>[pt[0],pt[1]]),tol);
      if(s.length>=4)rings.push(s);
    });
    const c=(p.centroid&&p.centroid.length===2)?p.centroid:(p.center||rings[0][0]);
    districts.push({name:p.name||'',label:String(p.name||'').replace(/[区县市]$/,''),c,rings});
  });
  const outer=[];
  eachRing(cityF.geometry,r=>{
    const s=simplify(r.map(pt=>[pt[0],pt[1]]),tol);
    if(s.length>=4)outer.push(s);
  });
  return {districts,outer,source:'live'};
}
function fromFallback(){
  const districts=FALLBACK.d.map(d=>({
    name:d.n,label:d.n,c:d.c,
    rings:d.r
  }));
  return {districts,outer:FALLBACK.o,source:'fallback'};
}

/* --- 绘制 --- */
function buildBase(data){
  gFill.innerHTML='';gInner.innerHTML='';gOutline.innerHTML='';gLabels.innerHTML='';
  const outerPaths=[];
  data.outer.forEach(r=>outerPaths.push(ringPath(r)));
  const outerD=outerPaths.join(' ');

  /* 1) 区县面：同色填充 + 同色细描边，压掉相邻面之间的抗锯齿缝 */
  data.districts.forEach(d=>{
    const p=el('path',{class:'district-fill',d:d.rings.map(ringPath).join(' ')});
    gFill.appendChild(p);
  });

  /* 2) 区县界：虚线，裁切在市域轮廓内（clipPath），不会溢出边界 */
  const innerD=[];
  data.districts.forEach(d=>d.rings.forEach(r=>innerD.push(ringPath(r))));
  gInner.appendChild(el('path',{class:'county-line',d:innerD.join(' ')}));

  /* 3) 市域轮廓：实线，压在最上层 */
  const outline=el('path',{class:'city-line',d:outerD});
  gOutline.appendChild(outline);
  clipShape.setAttribute('d',outerD);

  /* 4) 区县注记（内含避让：按面积从大到小放置，重叠者隐藏） */
  labelItems.length=0;
  data.districts.forEach(d=>{
    const t=el('text',{class:'district-label',x:wx(d.c[0]).toFixed(1),y:wy(d.c[1]).toFixed(1)});
    t.textContent=d.label;
    gLabels.appendChild(t);
    let area=0;
    d.rings.forEach(r=>{area+=Math.abs(ringArea(r));});
    labelItems.push({node:t,x:wx(d.c[0]),y:wy(d.c[1]),text:d.label,area});
  });

  /* 5) 点位是否落在市域外（如三星堆在广汉/德阳） */
  POINTS.forEach(p=>{
    p.outside=!data.outer.some(r=>pointInRing(p.lon,p.lat,r));
  });

  S.base=data;
  updateScales();
  renderPoints();
  renderList();
  updateCounts();
}

/* ========== 7. 视图 / 尺寸 ========== */
function unitsPerPx(){
  const r=svg.getBoundingClientRect();
  const w=Math.max(r.width,1),h=Math.max(r.height,1);
  return Math.max(S.vb[2]/w,S.vb[3]/h);
}
/* 让 viewBox 与容器同比例，避免上下/左右留白，也保证点线尺寸换算准确 */
function fitAspect(vb){
  const r=svg.getBoundingClientRect();
  if(!r.width||!r.height)return vb;
  const ar=r.width/r.height,cur=vb[2]/vb[3];
  if(cur>ar){
    const h=vb[2]/ar;
    return [vb[0],vb[1]-(h-vb[3])/2,vb[2],h];
  }
  const w=vb[3]*ar;
  return [vb[0]-(w-vb[2])/2,vb[1],w,vb[3]];
}
function setVB(vb){
  if(amapActive)return;
  S.vb=vb;
  svg.setAttribute('viewBox',vb.map(v=>v.toFixed(2)).join(' '));
  updateScales();
  scheduleViewRefresh();
}
function updateScales(){
  if(amapActive)return;
  if(!S.vb)return;
  const u=unitsPerPx();
  S.u=u;
  /* 点 */
  const r=u*5.0, hit=u*(window.innerWidth<860?17:14), fs=u*8.4;
  gPts.querySelectorAll('circle.dot').forEach(c=>c.setAttribute('r',r.toFixed(2)));
  gPts.querySelectorAll('circle.hit').forEach(c=>c.setAttribute('r',hit.toFixed(2)));
  gPts.querySelectorAll('circle.halo').forEach(c=>{
    c.setAttribute('r',(r*1.75).toFixed(2));
    c.setAttribute('stroke-width',(u*1.1).toFixed(2));
    c.setAttribute('stroke-dasharray',(u*3.4).toFixed(2)+' '+(u*2.8).toFixed(2));
  });
  gPts.querySelectorAll('text').forEach(t=>{
    const cy=parseFloat(t.getAttribute('data-cy'));
    t.setAttribute('font-size',fs.toFixed(2));
    t.setAttribute('y',(cy-r*2.0).toFixed(2));
  });
  /* 面缝描边 */
  gFill.querySelectorAll('path').forEach(p=>p.setAttribute('stroke-width',(u*1.0).toFixed(2)));
  /* 区县虚线 */
  gInner.querySelectorAll('path').forEach(p=>{
    p.setAttribute('stroke-width',(u*0.9).toFixed(2));
    p.setAttribute('stroke-dasharray',(u*3.2).toFixed(2)+' '+(u*3.8).toFixed(2));
  });
  /* 市域实线 */
  gOutline.querySelectorAll('path').forEach(p=>p.setAttribute('stroke-width',(u*1.7).toFixed(2)));
  /* 水系 */
  gWater.querySelectorAll('path').forEach(p=>p.setAttribute('stroke-width',(u*0.6).toFixed(2)));
  gWaterSmall.querySelectorAll('path').forEach(p=>p.setAttribute('stroke-width',(u*0.5).toFixed(2)));
  gWaterLine.querySelectorAll('path').forEach(p=>p.setAttribute('stroke-width',(u*1.1).toFixed(2)));
  gCanals.querySelectorAll('path').forEach(p=>p.setAttribute('stroke-width',(u*0.8).toFixed(2)));
  /* 路网：描边 + 芯线 */
  gRoadMain.querySelectorAll('.road-case').forEach(p=>p.setAttribute('stroke-width',(u*2.8).toFixed(2)));
  gRoadMain.querySelectorAll('.road-main').forEach(p=>p.setAttribute('stroke-width',(u*(+p.getAttribute('data-w'))).toFixed(2)));
  gRoadLocal.querySelectorAll('.road-case').forEach(p=>p.setAttribute('stroke-width',(u*2.0).toFixed(2)));
  gRoadLocal.querySelectorAll('.road-local').forEach(p=>p.setAttribute('stroke-width',(u*(+p.getAttribute('data-w'))).toFixed(2)));
  /* 细节层随缩放显隐：全域只留高速/快速路与主要河道，放大后补入干道、渠系、小水面 */
  const near=u<1.15;
  [gWaterSmall,gCanals,gRoadLocal].forEach(g=>{g.style.display=near?'':'none';});
  /* 注记：屏幕恒定字号 + 重叠避让（大区县优先） */
  const fsPx=12.5;
  labelItems.forEach(it=>{
    it.node.setAttribute('font-size',(u*fsPx).toFixed(2));
    it.node.setAttribute('stroke-width',(u*3.2).toFixed(2));
  });
  const placed=[];
  const rect=svg.getBoundingClientRect();
  labelItems.slice().sort((a,b)=>b.area-a.area).forEach(it=>{
    const px=(it.x-S.vb[0])/u, py=(it.y-S.vb[1])/u;
    const w=it.text.length*fsPx*1.05, h=fsPx*1.3;
    const clash=placed.some(q=>Math.abs(q.py-py)<h&&Math.abs(q.px-px)<(q.w+w)/2+3);
    const off=px<-40||py<-20||px>rect.width+40||py>rect.height+20;
    it.node.style.display=(clash||off)?'none':'';
    if(!clash&&!off)placed.push({px,py,w});
  });
  updateMe();
}

/* ========== 8. 点位与路线 ========== */
function ptVisible(p){
  if(S.hidden.has(p.cat))return false;
  if(S.query){
    const q=S.query.toLowerCase();
    if(!(p.zh.toLowerCase().includes(q)||p.en.toLowerCase().includes(q)||String(p.no)===q))return false;
  }
  return true;
}
function inView(p){
  if(amapActive&&amap){
    const b=amap.getBounds();
    return b?b.contains([p.lon,p.lat]):true;
  }
  const x0=S.vb[0],y0=S.vb[1],x1=x0+S.vb[2],y1=y0+S.vb[3];
  const x=wx(p.lon),y=wy(p.lat);
  return x>=x0&&x<=x1&&y>=y0&&y<=y1;
}
function renderPoints(){
  if(amapActive){amapSync();return;}
  gPts.innerHTML='';

  POINTS.forEach(p=>{
    const g=el('g',{class:'pt'+(p.outside?' out':'')+(S.activeId===p.no?' active':'')+(ptVisible(p)&&inView(p)?'':' hidden'),'data-id':p.no});
    const x=wx(p.lon),y=wy(p.lat);
    g.appendChild(el('circle',{cx:x,cy:y,class:'hit',fill:'transparent'}));
    if(p.outside){
      g.appendChild(el('circle',{cx:x,cy:y,class:'halo',stroke:CATS[p.cat].color}));
    }
    g.appendChild(el('circle',{cx:x,cy:y,class:'dot',fill:CATS[p.cat].color}));
    const t=el('text',{x:x,'data-cy':y});
    t.textContent=String(p.no).padStart(2,'0');
    g.appendChild(t);
    gPts.appendChild(g);
  });
  updateScales();
}
function renderRoutes(){
  if(amapActive){amapDrawRoute();return;}
  gRoute.innerHTML='';
  if(!S.routeOn)return;
  const r=ROUTES.find(x=>x.id===S.routeOn);
  if(!r)return;
  const pts=r.pts.map(n=>byNo[n]).filter(Boolean);
  if(pts.length<2)return;
  const d=pts.map((p,i)=>(i?'L':'M')+wx(p.lon)+','+wy(p.lat)).join(' ');
  gRoute.appendChild(el('path',{d,class:'route-path',stroke:r.color}));
}
function fitRoute(r){
  if(amapActive)return;
  const pts=r.pts.map(n=>byNo[n]).filter(Boolean);
  if(!pts.length)return;
  const lons=pts.map(p=>p.lon),lats=pts.map(p=>p.lat);
  animateVB(fitAspect(vbOf({
    lon0:Math.min(...lons)-0.02,lon1:Math.max(...lons)+0.02,
    lat0:Math.min(...lats)-0.015,lat1:Math.max(...lats)+0.015
  })));
}

/* ========== 10. 视图动画 ========== */
let vbAnim=null;
function animateVB(target,dur){
  dur=dur||460;
  if(vbAnim)cancelAnimationFrame(vbAnim);
  const from=S.vb.slice(),t0=performance.now();
  function step(t){
    const k=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-k,3);
    setVB(from.map((v,i)=>v+(target[i]-v)*e));
    if(k<1)vbAnim=requestAnimationFrame(step);
  }
  vbAnim=requestAnimationFrame(step);
}

/* 手机端：底部抽屉支持下拉关闭 */
(function(){
  const head=document.querySelector('.drawer-head');
  let startY=null,dy=0;
  head.addEventListener('pointerdown',e=>{
    if(window.innerWidth>860||e.target.closest('.drawer-close'))return;
    startY=e.clientY;dy=0;
    drawer.style.transition='none';
    try{head.setPointerCapture(e.pointerId);}catch(err){}
  });
  head.addEventListener('pointermove',e=>{
    if(startY===null)return;
    dy=Math.max(0,e.clientY-startY);
    drawer.style.transform='translateY('+dy+'px)';
  });
  const end=()=>{
    if(startY===null)return;
    drawer.style.transition='';
    drawer.style.transform='';
    const shouldClose=dy>90;
    startY=null;dy=0;
    if(shouldClose)closeDrawer();
  };
  head.addEventListener('pointerup',end);
  head.addEventListener('pointercancel',end);
})();

  btn.textContent=p.img?(S.lang==='zh'?'更换照片':'Replace'):(S.lang==='zh'?'添加照片':'Add photo');
  btn.onclick=()=>{photoFor=p.no;document.getElementById('photoInput').click();};
  box.appendChild(btn);
  if(p.img){
    const del=document.createElement('button');
    del.type='button';
    del.className='img-btn remove';
    del.textContent=(S.lang==='zh'?'移除':'Remove');
    del.onclick=()=>removePhoto(p.no);
    box.appendChild(del);
  }
}
function removePhoto(no){
  delete PHOTOS[no];
  const p=byNo[no];
  if(p){p.img='';if(S.activeId===no)renderDrawerImage(p);}
  savePhotos();
}
async function compressImage(file,maxSide,quality){
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1,maxSide/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(bmp,0,0,w,h);
  if(bmp.close)bmp.close();
  return c.toDataURL('image/jpeg',quality);
}
document.getElementById('photoInput').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!file||photoFor==null)return;
  try{
    const data=await compressImage(file,1400,0.82);
    PHOTOS[photoFor]=data;
    const p=byNo[photoFor];
    if(p){p.img=data;if(S.activeId===p.no)renderDrawerImage(p);}
    savePhotos();
    toast(S.lang==='zh'?'照片已加入（本机暂存，导出后才会发布）':'Photo added locally — export to publish');
  }catch(err){
    console.warn(err);
    toast(S.lang==='zh'?'图片读取失败，换一张试试':'Could not read that image');
  }
});
document.getElementById('btnExport').onclick=async()=>{
  if(!Object.keys(PHOTOS).length){
    toast(S.lang==='zh'?'还没有照片，先在项目详情里添加':'No photos yet');
    return;
  }
  try{
    const res=await fetch(location.href,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    let src=await res.text();
    const re=/(<script type="application\/json" id="photoStore">)[\s\S]*?(<\/script>)/;
    if(!re.test(src))throw new Error('photoStore missing');
    const json=JSON.stringify(PHOTOS);
    src=src.replace(re,(m,a,b)=>a+json+b);
    const blob=new Blob([src],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='index.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),8000);
    toast(S.lang==='zh'?('已导出，共 '+Object.keys(PHOTOS).length+' 张照片'):'Exported with photos');
  }catch(err){
    console.warn(err);
    toast(S.lang==='zh'?'导出失败：请用 https 或 localhost 打开本页':'Export failed — open via https/localhost');
  }
};

/* ========== 12. 地图交互 ========== */
let dragging=false,dragMoved=false,lastX=0,lastY=0;
const tip=document.getElementById('tip');
svg.addEventListener('pointerdown',e=>{
  if(e.target.closest('.pt'))return;
  dragging=true;dragMoved=false;lastX=e.clientX;lastY=e.clientY;
  svg.classList.add('dragging');
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(dragging){
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.abs(dx)+Math.abs(dy)>2)dragMoved=true;
    const r=svg.getBoundingClientRect();
    const sx=S.vb[2]/r.width,sy=S.vb[3]/r.height;
    setVB([S.vb[0]-dx*sx,S.vb[1]-dy*sy,S.vb[2],S.vb[3]]);
    lastX=e.clientX;lastY=e.clientY;
    return;
  }
  const g=e.target.closest?e.target.closest('.pt'):null;
  if(g){
    const p=byNo[+g.dataset.id];
    const r=svg.getBoundingClientRect();
    tip.textContent=(S.lang==='zh'?p.zh:p.en)+(p.approx?' ≈':'')+(p.outside?(S.lang==='zh'?' · 市域外':' · outside'):'');
    tip.style.left=(e.clientX-r.left)+'px';
    tip.style.top=(e.clientY-r.top)+'px';
    tip.classList.add('show');
  }else{
    tip.classList.remove('show');
  }
});
svg.addEventListener('pointerup',()=>{dragging=false;svg.classList.remove('dragging');});
svg.addEventListener('pointercancel',()=>{dragging=false;svg.classList.remove('dragging');});
svg.addEventListener('pointerleave',()=>{tip.classList.remove('show');});
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height;
  const k=e.deltaY>0?1.14:0.88;
  const nw=S.vb[2]*k,nh=S.vb[3]*k;
  const nx=S.vb[0]+(S.vb[2]-nw)*mx,ny=S.vb[1]+(S.vb[3]-nh)*my;
  setVB([nx,ny,nw,nh]);
},{passive:false});
svg.addEventListener('click',e=>{
  if(dragMoved)return;
  if(pickMode){
    const r=svg.getBoundingClientRect();
    const lon=CX+(S.vb[0]+(e.clientX-r.left)/r.width*S.vb[2])/KX;
    const lat=CY-(S.vb[1]+(e.clientY-r.top)/r.height*S.vb[3])/KY;
    setPos(lon,lat,null,true);
    exitPick();
    return;
  }
  const g=e.target.closest?e.target.closest('.pt'):null;
  if(g)selectPoint(+g.dataset.id,false);
});
let pinch=null;
svg.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    const a=e.touches[0],b=e.touches[1];
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),vb:S.vb.slice()};
  }
},{passive:true});
svg.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length===2){
    const a=e.touches[0],b=e.touches[1];
    const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const k=pinch.d/dist;
    const r=svg.getBoundingClientRect();
    const mx=((a.clientX+b.clientX)/2-r.left)/r.width;
    const my=((a.clientY+b.clientY)/2-r.top)/r.height;
    const nw=pinch.vb[2]*k,nh=pinch.vb[3]*k;
    const nx=pinch.vb[0]+(pinch.vb[2]-nw)*mx,ny=pinch.vb[1]+(pinch.vb[3]-nh)*my;
    setVB([nx,ny,nw,nh]);
  }
},{passive:true});
svg.addEventListener('touchend',()=>{pinch=null;});

/* 视图变化后刷新列表（防抖），并同步“主城/全域”状态 */
let viewTimer=null;
function scheduleViewRefresh(){

  viewTimer=setTimeout(()=>{

}

/* ========== 13. 我的位置 ========== */
/* 浏览器 Geolocation 返回 WGS-84，而本图底图与点位是 GCJ-02（高德系），
   不转换会出现 300–500 m 的系统性偏移。 */
const PI=Math.PI, GCJ_A=6378245.0, GCJ_EE=0.00669342162296594323;
function _tLat(x,y){
  let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;
  r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;
  r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;
  return r;
}
function _tLon(x,y){
  let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;
  r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;
  r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;
  return r;
}
function wgs2gcj(lon,lat){
  const dLat0=_tLat(lon-105,lat-35), dLon0=_tLon(lon-105,lat-35);
  const radLat=lat/180*PI;
  let magic=Math.sin(radLat); magic=1-GCJ_EE*magic*magic;
  const sq=Math.sqrt(magic);
  const dLat=(dLat0*180)/((GCJ_A*(1-GCJ_EE))/(magic*sq)*PI);
  const dLon=(dLon0*180)/(GCJ_A/sq*Math.cos(radLat)*PI);
  return [lon+dLon,lat+dLat];
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000,dLat=(lat2-lat1)*PI/180,dLon=(lon2-lon1)*PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*PI/180)*Math.cos(lat2*PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function fmtDist(m){return m<1000?Math.round(m)+' m':(m<10000?(m/1000).toFixed(1):Math.round(m/1000))+' km';}

let myPos=null, meEls=null, geoWatch=null, lastFixAt=0;
const geoBtn=document.getElementById('geoBtn');
const nearCard=document.getElementById('nearCard');
const nearList=document.getElementById('nearList');

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3600);
}
function drawMe(){
  if(amapActive){amapDrawMe();return;}
  gMe.innerHTML='';meEls=null;
  if(!myPos)return;
  const x=wx(myPos.lon),y=wy(myPos.lat);
  const acc=el('circle',{class:'me-acc',cx:x,cy:y});
  const pulse=el('circle',{class:'me-pulse',cx:x,cy:y,fill:'#3D8BFD'});
  const ring=el('circle',{class:'me-ring',cx:x,cy:y,fill:'#FFFFFF'});
  const dot=el('circle',{class:'me-dot',cx:x,cy:y,fill:'#3D8BFD'});
  [acc,pulse,ring,dot].forEach(n=>gMe.appendChild(n));
  meEls={acc,pulse,ring,dot};
  updateMe();
}
function updateMe(){
  if(!meEls||!myPos)return;
  const u=S.u;
  meEls.acc.setAttribute('r',((myPos.acc||30)/95.4).toFixed(2));
  meEls.pulse.setAttribute('r',(u*9).toFixed(1));
  meEls.ring.setAttribute('r',(u*8.5).toFixed(1));
  meEls.dot.setAttribute('r',(u*5.5).toFixed(1));
}
function nearestItems(n){
  const arr=POINTS.map(p=>({p,d:haversine(myPos.lat,myPos.lon,p.lat,p.lon)}));
  arr.sort((a,b)=>a.d-b.d);
  return arr.slice(0,n||5);
}
function renderNear(){
  if(!myPos){nearCard.hidden=true;return;}
  nearCard.hidden=false;
  document.getElementById('nearAcc').textContent=myPos.manual
    ?(S.lang==='zh'?'手动选点':'Manual')
    :(myPos.acc?('±'+Math.round(myPos.acc)+' m'):'');
  nearList.innerHTML=nearestItems(5).map(it=>{
    const cat=CATS[it.p.cat];
    const name=(S.lang==='zh'?it.p.zh:it.p.en).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
    return '<button class="near-item" data-no="'+it.p.no+'">'+
      '<span class="near-dot" style="background:'+cat.color+'"></span>'+
      '<span class="near-name">'+name+'</span>'+
      '<span class="near-dist">'+fmtDist(it.d)+'</span></button>';
  }).join('');
  nearList.querySelectorAll('.near-item').forEach(b=>{
    b.onclick=()=>{selectPoint(+b.dataset.no,true);};
  });
}
function setPos(lon,lat,acc,manual){
  const moved=!myPos||haversine(myPos.lat,myPos.lon,lat,lon)>8;
  myPos={lon,lat,acc:acc==null?null:acc,manual:!!manual,at:Date.now()};
  myPos.inCity=!!S.base&&S.base.outer.some(r=>pointInRing(lon,lat,r));
  lastFixAt=Date.now();
  drawMe();
  renderNear();
  if(moved){
    if(myPos.inCity)flyToMe();
    else toast(S.lang==='zh'?'你不在成都市域内，已按距离列出最近的项目':'You are outside Chengdu; nearest projects listed');
  }
}
function applyFix(pos){
  const c=pos.coords;
  const g=wgs2gcj(c.longitude,c.latitude);
  setPos(g[0],g[1],c.accuracy||30,false);
}
function flyToMe(){
  if(amapActive&&amap){amap.setZoomAndCenter(14,[myPos.lon,myPos.lat]);return;}
  const span=Math.max(0.03,(myPos.acc||40)*5/95000);
  animateVB(fitAspect(vbOf({
    lon0:myPos.lon-span/2,lon1:myPos.lon+span/2,
    lat0:myPos.lat-span/2*1.15,lat1:myPos.lat+span/2*1.15
  })));
}
let pickMode=false;
function enterPick(){
  pickMode=true;
  geoBtn.classList.add('on');
  svg.classList.add('picking');
  toast(S.lang==='zh'?'点击地图上的位置，设为“我的位置”':'Tap the map to set your location');
}
function exitPick(){
  pickMode=false;
  geoBtn.classList.remove('on');
  svg.classList.remove('picking');
}
function startLocate(){
  if(!window.isSecureContext){
    toast(S.lang==='zh'?'当前页面不是 HTTPS，无法调用设备定位，已改为手动选点':'Not HTTPS — manual pick instead');
    enterPick();
    return;
  }
  if(!navigator.geolocation){
    toast(S.lang==='zh'?'当前浏览器不支持设备定位，已改为手动选点':'Geolocation unsupported — manual pick');
    enterPick();
    return;
  }
  geoBtn.classList.add('loading');
  if(amapActive&&amap){amapLocate();return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{geoBtn.classList.remove('loading');geoBtn.classList.add('on');applyFix(pos);watchMe();},
    err=>{
      geoBtn.classList.remove('loading');
      toast(errMsg(err));
      if(!err||err.code!==1)enterPick();
    },
    {enableHighAccuracy:true,timeout:8000,maximumAge:0}
  );
}
function watchMe(){
  if(geoWatch!==null)return;
  try{
    geoWatch=navigator.geolocation.watchPosition(
      pos=>{if(Date.now()-lastFixAt>2500)applyFix(pos);},
      ()=>{},
      {enableHighAccuracy:true,maximumAge:5000,timeout:20000}
    );
  }catch(e){}
}
function stopLocate(){
  if(geoWatch!==null){try{navigator.geolocation.clearWatch(geoWatch);}catch(e){}geoWatch=null;}
  myPos=null;drawMe();nearCard.hidden=true;
  geoBtn.classList.remove('on','loading');
  gMe.innerHTML='';
  if(amapActive)amapDrawMe();
  exitPick();
}
function errMsg(err){
  const L=S.lang==='zh';
  if(err&&err.code===1)return L?'已拒绝定位权限，可在浏览器设置里重新允许':'Location permission denied';
  if(err&&err.code===3)return L?'定位超时，请开启 GPS 或到室外重试':'Location request timed out';
  return L?'无法获取位置（定位服务可能被关闭）':'Position unavailable';
}
geoBtn.onclick=()=>{
  if(pickMode){exitPick();return;}
  if(myPos){stopLocate();return;}
  startLocate();
};
document.getElementById('nearClose').onclick=()=>{stopLocate();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pickMode)exitPick();});

/* 高德地图链接：坐标本就是 GCJ-02，直接以 coordinate=gaode 传入 */
function isMobileUA(){return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'');}
function amapMarker(p){
  return 'https://uri.amap.com/marker?position='+p.lon.toFixed(6)+','+p.lat.toFixed(6)+
    '&name='+encodeURIComponent(p.zh)+'&src=chengdu-sample&coordinate=gaode&callnative='+(isMobileUA()?1:0);
}
function amapNavUrl(p){
  let u='https://uri.amap.com/navigation?to='+p.lon.toFixed(6)+','+p.lat.toFixed(6)+','+encodeURIComponent(p.zh)+
    '&mode=car&policy=1&src=chengdu-sample&coordinate=gaode&callnative='+(isMobileUA()?1:0);
  if(myPos)u+='&from='+myPos.lon.toFixed(6)+','+myPos.lat.toFixed(6)+','+encodeURIComponent(S.lang==='zh'?'我的位置':'My location');
  return u;
}

/* ========== 15. 语言 ========== */
function applyLang(){
  document.getElementById('mainTitle').textContent=S.lang==='zh'
    ?'成都样本：一座公园城市的项目轨迹'
    :'The Chengdu Sample: A Project Atlas of Park City';
  document.getElementById('subTitle').textContent=S.lang==='zh'
    ?'The Chengdu Sample: A Project Atlas of Park City'
    :'成都样本：一座公园城市的项目轨迹';

    el2.textContent=S.lang==='zh'?el2.dataset.zh:el2.dataset.en;
  });

    ?(S.lang==='zh'?'全域':'All')
    :(S.lang==='zh'?'主城':'City');
  if(myPos)renderNear();
}

/* ========== 16. 初始化 ========== */
function init(){
  POINTS.forEach(p=>{if(PHOTOS[p.no])p.img=PHOTOS[p.no];});
  updatePhotoStat();
  renderLegend();
  renderRoutesList();
  /* 竖屏手机：全域轮廓在 390px 宽下会把 106 个点挤成一团，默认落在主城视图 */
  const portrait=window.innerWidth<700&&window.innerHeight>window.innerWidth;
  S.view=portrait?'city':'all';
  S.vb=fitAspect(vbOf(VIEWS[S.view]));
  setVB(S.vb);
  buildOsm();
  /* 先用内置轮廓立即成图（含裁切），在线官方数据到达后再无缝替换 */
  buildBase(fromFallback());
  document.getElementById('badgeSrc').textContent='底图 内置简化轮廓 · 正在同步官方数据…';
  document.getElementById('btnTheme').textContent='☀';
  applyLang();
  loadBase();
  if(AMAP_ENABLED){
    loadAmapSDK().then(()=>{
      initAmap();
      S.view='all';
      amap.setZoomAndCenter(10,[CX,CY]);
      /* 12 秒内没收到 complete，说明 Key / 安全密钥 / 域名白名单有问题，退回内置底图 */
      setTimeout(()=>{
        if(amapActive)return;
        const h=document.getElementById('amap');
        if(h)h.remove();
        amap=null;
        console.warn('[高德] 地图未完成加载，请检查 Key 域名白名单');
        toast(S.lang==='zh'?'高德底图未加载，已使用内置底图（检查域名白名单）':'Amap map failed, using built-in basemap');
      },12000);
    }).catch(err=>{
      console.warn('[高德] SDK 加载失败，继续使用内置底图',err&&err.message||err);
      toast(S.lang==='zh'?'高德底图加载失败，已使用内置底图':'Amap SDK failed, using built-in basemap');
    });
  }
}
init();

/* 容器尺寸变化：等比补边，保持地图铺满 */
let resizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    const cx=S.vb[0]+S.vb[2]/2,cy=S.vb[1]+S.vb[3]/2;
    const w=S.vb[2],h=S.vb[3];
    setVB(fitAspect([cx-w/2,cy-h/2,w,h]));
  },180);
});
